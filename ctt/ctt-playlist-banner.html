<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CTT Playlist Banner</title>
<link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@300;400;600&family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;1,9..144,300;1,9..144,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="ctt-toolkit-shared.css">
<style>
  /* ── BANNER TOOL ── */
  .upload-zone {
    background: #1a1410;
    border: 2px dashed #3a302a;
    border-radius: 4px;
    padding: 40px;
    text-align: center;
    cursor: pointer;
    margin-bottom: 20px;
    transition: border-color 0.2s;
  }

  .upload-zone:hover {
    border-color: var(--accent);
  }

  .upload-icon {
    font-size: 40px;
    margin-bottom: 12px;
  }

  .upload-label {
    font-size: 13px;
    font-weight: 400;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: rgba(255,255,255,0.5);
    margin-bottom: 6px;
  }

  .upload-hint {
    font-size: 11px;
    color: rgba(255,255,255,0.25);
  }

  #fileInput { display: none; }

  .album-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
    gap: 8px;
    margin-bottom: 20px;
  }

  .album-thumb {
    position: relative;
    border-radius: 4px;
    overflow: hidden;
    background: #2a2a2a;
    aspect-ratio: 1;
  }

  .album-thumb img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  .album-badge {
    position: absolute;
    top: 4px;
    left: 4px;
    background: rgba(0,0,0,0.8);
    color: #fff;
    font-size: 10px;
    font-weight: 600;
    padding: 2px 6px;
    border-radius: 3px;
  }

  .album-del {
    position: absolute;
    top: 4px;
    right: 4px;
    background: #b5623a;
    color: white;
    border: none;
    width: 20px;
    height: 20px;
    border-radius: 50%;
    cursor: pointer;
    font-size: 14px;
    line-height: 1;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .canvas-wrap {
    background: #111;
    border-radius: 4px;
    padding: 16px;
    margin-bottom: 16px;
  }

  #bannerCanvas {
    width: 100%;
    display: block;
    border-radius: 4px;
  }

  .banner-btn-row {
    display: flex;
    gap: 10px;
  }

  .btn-banner-dl {
    background: var(--accent);
    color: #fff;
    border-color: var(--accent);
  }

  .btn-banner-dl:hover { background: var(--accent-dark); }

  .btn-banner-clr {
    background: transparent;
    color: var(--text-muted);
    border-color: var(--border);
  }

  .btn-banner-clr:hover {
    background: var(--border);
    color: var(--text);
  }
</style>
</head>
<body>

<header class="site-header">
  <div class="site-title">Consuming the <span>Tangible</span></div>
  <div class="site-subtitle">Playlist Banner</div>
</header>

<div class="panel" id="tab-banner">
  <div class="panel-title">Playlist Banner</div>
  <div class="panel-desc">Upload album covers, drag to reorder, then download the 900×600 banner to use as the playlist post's featured image.</div>

  <div class="upload-zone" id="dropZone" onclick="document.getElementById('fileInput').click()">
    <div class="upload-icon">◈</div>
    <div class="upload-label">Click or drop album covers</div>
    <div class="upload-hint">6–12 square images recommended</div>
    <input type="file" id="fileInput" multiple accept="image/*">
  </div>

  <div class="album-grid" id="albumGrid"></div>

  <div class="canvas-wrap">
    <canvas id="bannerCanvas" width="900" height="600"></canvas>
  </div>

  <div class="banner-btn-row">
    <button class="btn btn-banner-dl" onclick="bannerDownload()">Download 900×600</button>
    <button class="btn btn-banner-clr" onclick="bannerClear()">Clear All</button>
  </div>
</div>

<script>
/* ══════════════════════════
   PLAYLIST BANNER
══════════════════════════ */
let imgs = [];
let dragIdx = null;
const canvas = document.getElementById('bannerCanvas');
const ctx = canvas.getContext('2d');
const fileInput = document.getElementById('fileInput');
const dropZone = document.getElementById('dropZone');

function loadFile(file) {
  if (!file.type.startsWith('image/')) return;
  const r = new FileReader();
  r.onload = ev => {
    const im = new Image();
    im.onload = () => { imgs.push(im); bannerDraw(); };
    im.src = ev.target.result;
  };
  r.readAsDataURL(file);
}

fileInput.onchange = e => {
  [...e.target.files].forEach(loadFile);
  e.target.value = '';
};

dropZone.ondragover = e => e.preventDefault();
dropZone.ondrop = e => {
  e.preventDefault();
  [...e.dataTransfer.files].forEach(loadFile);
};

function bannerDraw() {
  renderGrid();
  renderCanvas();
}

function renderGrid() {
  const grid = document.getElementById('albumGrid');
  if (imgs.length === 0) { grid.innerHTML = ''; return; }
  grid.innerHTML = '';
  imgs.forEach((im, i) => {
    const div = document.createElement('div');
    div.className = 'album-thumb';
    div.draggable = true;
    div.dataset.i = i;
    div.innerHTML = `<img src="${im.src}" draggable="false"><div class="album-badge">${i+1}</div><button class="album-del" data-d="${i}">×</button>`;
    div.addEventListener('dragstart', () => { dragIdx = i; div.style.opacity = '0.4'; });
    div.addEventListener('dragend', () => { div.style.opacity = '1'; });
    div.addEventListener('dragover', e => e.preventDefault());
    div.addEventListener('drop', e => {
      e.preventDefault();
      if (dragIdx !== null && dragIdx !== i) {
        const item = imgs[dragIdx];
        imgs.splice(dragIdx, 1);
        imgs.splice(i, 0, item);
        dragIdx = null;
        bannerDraw();
      }
    });
    grid.appendChild(div);
  });
  document.querySelectorAll('.album-del').forEach(btn => {
    btn.addEventListener('click', e => {
      e.stopPropagation();
      imgs.splice(parseInt(btn.dataset.d), 1);
      bannerDraw();
    });
  });
}

function renderCanvas() {
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, 900, 600);

  if (imgs.length === 0) {
    ctx.fillStyle = '#444';
    ctx.font = 'bold 20px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('Upload album covers to preview', 450, 300);
    return;
  }

  const mults = imgs.map(() => 0.7 + Math.random() * 0.6);
  const total = mults.reduce((s, m) => s + m, 0);
  const widths = mults.map(m => (m / total) * 900);

  const tmp = document.createElement('canvas');
  const tc = tmp.getContext('2d');
  let x = 0;

  imgs.forEach((im, i) => {
    const w = widths[i];
    tmp.width = w; tmp.height = 600;
    tc.drawImage(im, (im.width - w) / 2, (im.height - 600) / 2, w, 600, 0, 0, w, 600);
    const id = tc.getImageData(0, 0, w, 600);
    const d = id.data;
    for (let j = 0; j < d.length; j += 4) {
      d[j]   = Math.max(0, Math.min(255, ((d[j]   - 128) * 1.15) + 128));
      d[j+1] = Math.max(0, Math.min(255, ((d[j+1] - 128) * 1.15) + 128));
      d[j+2] = Math.max(0, Math.min(255, ((d[j+2] - 128) * 1.15) + 128));
      const g = 0.2989*d[j] + 0.5870*d[j+1] + 0.1140*d[j+2];
      d[j]   = Math.max(0, Math.min(255, g + 1.2*(d[j]   - g)));
      d[j+1] = Math.max(0, Math.min(255, g + 1.2*(d[j+1] - g)));
      d[j+2] = Math.max(0, Math.min(255, g + 1.2*(d[j+2] - g)));
    }
    tc.putImageData(id, 0, 0);
    ctx.drawImage(tmp, x, 0);
    x += w;
  });

  ctx.strokeStyle = 'rgba(0,0,0,0.6)';
  ctx.lineWidth = 3;
  x = 0;
  for (let i = 1; i < imgs.length; i++) {
    x += widths[i-1];
    ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, 600); ctx.stroke();
  }

  const lg = ctx.createLinearGradient(0, 0, 100, 0);
  lg.addColorStop(0, 'rgba(0,0,0,0.85)'); lg.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = lg; ctx.fillRect(0, 0, 100, 600);

  const rg = ctx.createLinearGradient(800, 0, 900, 0);
  rg.addColorStop(0, 'rgba(0,0,0,0)'); rg.addColorStop(1, 'rgba(0,0,0,0.85)');
  ctx.fillStyle = rg; ctx.fillRect(800, 0, 100, 600);
}

function bannerDownload() {
  if (imgs.length === 0) return;
  const a = document.createElement('a');
  a.download = 'playlist-banner-' + Date.now() + '.png';
  a.href = canvas.toDataURL();
  a.click();
}

function bannerClear() {
  imgs = [];
  bannerDraw();
}

bannerDraw();
</script>
</body>
</html>
